site_name: Neurofuzzy Semantic Similarity
site_description: Reproducible neurofuzzy semantic similarity measurement with a unified benchmark harness, baselines, and statistical testing.
site_url: https://jorge-martinez-gil.github.io/dke2023/
repo_url: https://github.com/jorge-martinez-gil/dke2023
repo_name: jorge-martinez-gil/dke2023
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Benchmark protocol: benchmark.md
  - Datasets: datasets.md
  - Extending: extending.md
  - Results: results.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
