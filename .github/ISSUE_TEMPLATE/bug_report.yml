name: "Bug report"
description: "Report a problem so we can fix it"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to file a bug report!"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command(s) and a minimal example if possible.
      placeholder: |
        1. Run `python -m neurofuzzy.benchmark --all --seeds 3`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `python -c "import neurofuzzy, numpy, scipy, pandas, sys; print(neurofuzzy.__version__, sys.version)"`
    validations:
      required: true
