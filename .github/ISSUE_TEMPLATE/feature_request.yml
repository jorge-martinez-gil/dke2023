name: "Feature request"
description: "Suggest a dataset, baseline, metric, or capability"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New dataset
        - New baseline / method
        - New metric
        - Benchmark / reporting
        - Documentation / tutorial
        - Other
    validations:
      required: true
