name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check neurofuzzy tests experiments examples
      - name: Ruff format check
        run: ruff format --check neurofuzzy tests experiments examples
      - name: Type check (informational)
        run: mypy
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=neurofuzzy --cov-report=term-missing

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: pip install -e ".[viz]"
      - name: Benchmark smoke test (baselines, 2 seeds)
        run: |
          python -m neurofuzzy.benchmark --all --seeds 2 \
            --methods mean-of-features best-single-feature linear-regression \
            --datasets mc geresid --out /tmp/bench
      - name: Figures smoke test
        run: python -m neurofuzzy.visualize --results /tmp/bench --out /tmp/figs --no-fit
