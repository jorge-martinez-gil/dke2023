[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofuzzy"
version = "1.0.0"
description = "Neurofuzzy Semantic Similarity Measurement"
authors = [
    {name = "Jorge Martinez-Gil"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
]
keywords = ["semantic similarity", "fuzzy logic", "neural networks", "NLP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[project.urls]
"Homepage" = "https://github.com/jorge-martinez-gil/dke2023"
"Paper" = "https://doi.org/10.1016/j.datak.2023.102155"
"Bug Tracker" = "https://github.com/jorge-martinez-gil/dke2023/issues"

[tool.setuptools.packages.find]
include = ["neurofuzzy*"]
