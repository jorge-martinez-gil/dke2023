[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofuzzy"
version = "1.1.0"
description = "Reproducible neurofuzzy semantic similarity measurement with a unified benchmark harness, baselines, and publication-quality reporting."
authors = [
    {name = "Jorge Martinez-Gil"},
]
maintainers = [
    {name = "Jorge Martinez-Gil"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]
keywords = [
    "semantic similarity",
    "fuzzy logic",
    "fuzzy inference system",
    "mamdani",
    "neuro-fuzzy",
    "differential evolution",
    "word similarity",
    "natural language processing",
    "benchmark",
    "reproducible research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit",
    "matplotlib>=3.7",
]

[project.scripts]
neurofuzzy-benchmark = "neurofuzzy.benchmark:main"
neurofuzzy-figures = "neurofuzzy.visualize:main"

[project.urls]
"Homepage" = "https://github.com/jorge-martinez-gil/dke2023"
"Repository" = "https://github.com/jorge-martinez-gil/dke2023"
"Paper" = "https://doi.org/10.1016/j.datak.2023.102155"
"Bug Tracker" = "https://github.com/jorge-martinez-gil/dke2023/issues"

[tool.setuptools.packages.find]
include = ["neurofuzzy*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["neurofuzzy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["neurofuzzy"]
omit = ["neurofuzzy/visualize.py"]
